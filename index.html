<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="You're invited to celebrate our special day on 13 November 2026 in Madurai."
    />
    <meta property="og:title" content="Sundar S ❤️ Harini S — Wedding Invitation" />
    <meta
      property="og:description"
      content="You're invited to celebrate our special day on 13 November 2026 in Madurai."
    />
    <meta property="og:image" content="assets/images/couple.svg" />
    <meta property="og:url" content="https://example.com" />
    <meta property="og:type" content="website" />
    <title>Sundar S ❤️ Harini S — Wedding Invitation</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="page-opening" data-page="opening">
    <div class="opening-screen" aria-label="Wedding opening page">
      <div class="background-blur" aria-hidden="true"></div>
      <div class="opening-content">
        <p class="subtitle">Together with the blessings of our families</p>

        <div class="names-wrap" aria-label="Couple names">
          <span class="name-card" data-config="groomName">Sundar S</span>
          <span class="heart-separator" aria-hidden="true">❤️</span>
          <span class="name-card" data-config="brideName">Harini S</span>
        </div>

        <h1 class="wedding-heading">We are getting married</h1>

        <div class="photo-frame">
          <img src="assets/images/couple.jpg" data-image-config="couple" alt="Sundar and Harini smiling together" class="opening-photo" />
        </div>

        <button id="openInvitationBtn" class="primary-btn open-btn" type="button" aria-label="Open invitation">
          ✨ OPEN INVITATION
        </button>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
